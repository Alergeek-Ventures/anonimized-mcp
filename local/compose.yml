# Local Postgres: the application database plus the synthetic `sandbox`
# database that the gateway reads through the read-only `debug_reader` role.
services:
  db:
    image: docker.io/library/postgres:18
    container_name: anonimized-mcp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5455}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
