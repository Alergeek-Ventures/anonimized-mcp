name: Secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: 1.9.0
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" betterleaks

      # The whole history, so a secret removed in a later commit still fails.
      - name: Scan
        run: ./betterleaks git --redact --no-banner .
