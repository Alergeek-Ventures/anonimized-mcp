[project]
name = "pii-bench"
version = "0.1.0"
description = "Benchmark of local PII detectors for anonimized-mcp"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.6",
  "transformers>=4.57",
  "gliner2",
  "huggingface_hub",
  "datasets",
  "faker",
  "requests",
  "onnxruntime",
  "psutil",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
